name: Renovate ODG
on:
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC (02:00/03:00 CET/CEST)
  # Run after every merge to main so renovate rebases / automerges its PRs
  # before they go stale. In the open-component-model org this is a full run;
  # in forks it only produces validate + dry-run runs (see conditions below).
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      repoCache:
        description: 'Repository cache: enabled (use + update), disabled (skip), reset (discard old, start fresh)'
        type: choice
        default: enabled
        options: [ enabled, disabled, reset ]
      ignoreSchedule:
        description: 'Ignore renovate.json5 schedule'
        type: boolean
        default: false
      logLevel:
        description: 'Log level'
        type: choice
        default: info
        options: [ info, debug ]
      useOdgbotCredentials:
        description: 'Use odgbot GitHub App credentials if configured (else: GITHUB_TOKEN)'
        type: boolean
        default: true
  pull_request:
    branches:
      - main
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate.yml

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: renovate-cache
  RENOVATE_CONFIG_FILE: .github/renovate.json5

jobs:
  # validate is side-effect-free and runs everywhere (incl. forks).
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ env.RENOVATE_CONFIG_FILE }}
          persist-credentials: false

      - name: Create validator script
        run: printf '#!/bin/bash\nrenovate-config-validator "$RENOVATE_CONFIG_FILE"\n' > renovate-config-validator.sh && chmod +x renovate-config-validator.sh

      - name: Validate Renovate config
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          docker-cmd-file: renovate-config-validator.sh
          renovate-version: '44.39.0@sha256:e331219979fc6b38fc5cf7cd5beda63d4fc19963c3ef20404a2e99c8c12118a0'
          token: ${{ secrets.GITHUB_TOKEN }}

  # Behaviour depends on whether the odgbot App credentials are used (see
  # USE_ODGBOT): full runs (upstream schedule/pushes, manual runs with the
  # toggle on) manage real PRs, everything else — PRs, forks, manual runs
  # without the toggle — is a read-only dry-run.
  renovate:
    if: github.event_name != 'schedule' || github.repository_owner == 'open-component-model'
    runs-on: ubuntu-latest
    needs: validate
    env:
      # Full runs use the odgbot App credentials whenever they are configured —
      # except for PRs (always read-only) and manual runs with the toggle off.
      # Forks don't have the credentials configured, so they always dry-run
      # unless their owner configures the App and dispatches manually.
      USE_ODGBOT: ${{ github.event_name != 'pull_request' && vars.ODG_BOT_APP_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.useOdgbotCredentials) }}
    environment:
      name: automation
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout:
            ${{ env.RENOVATE_CONFIG_FILE }}
          persist-credentials: false

      # Restore the repository cache written by the last full run (unique key
      # per run, prefix-matched on restore; unused entries expire after 7
      # days). Skipped when the cache is disabled or reset — reset rebuilds a
      # fresh cache below and ignores the old one.
      - name: Restore renovate cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.repoCache == 'enabled' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}
          restore-keys: ${{ env.cache_key }}-

      # The containerized renovate runs as uid 12021 and needs write access to
      # the restored cache directory.
      - name: Fix cache directory permissions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.repoCache != 'disabled' }}
        run: |
          set -euxo pipefail
          sudo mkdir -p "$cache_dir"
          sudo chown -R 12021:0 /tmp/renovate/

      - name: Generate odgbot token
        if: env.USE_ODGBOT == 'true'
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ODG_BOT_APP_ID }}
          private-key: ${{ secrets.ODG_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write
          permission-vulnerability-alerts: read

      # Exactly the opposite of the token generation above: without odgbot
      # credentials the run is read-only (the GITHUB_TOKEN fallback cannot
      # push branches or PRs).
      - name: Ensure Dry-Run without odgbot credentials
        if: env.USE_ODGBOT != 'true'
        run: echo "RENOVATE_DRY_RUN=extract" >> "$GITHUB_ENV"

      - name: Run
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          env-regex: |
            ^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy)$
          token: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}
          renovate-version: '44.39.0@sha256:e331219979fc6b38fc5cf7cd5beda63d4fc19963c3ef20404a2e99c8c12118a0'
        env:
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_USERNAME: 'odgbot[bot]'
          RENOVATE_PLATFORM: 'github'
          RENOVATE_PLATFORM_COMMIT: 'enabled'
          RENOVATE_REPOSITORIES: "${{ github.repository }}"
          RENOVATE_REPOSITORY_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.repoCache || 'enabled' }}
          RENOVATE_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.ignoreSchedule) && '{"schedule":null}' || '' }}
          LOG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.logLevel || 'info' }}
          RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS: '["python3"]'

      # Only full runs write back an up-to-date cache.
      - name: Save renovate cache
        if: ${{ env.USE_ODGBOT == 'true' && (github.event_name != 'workflow_dispatch' || inputs.repoCache != 'disabled') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}
