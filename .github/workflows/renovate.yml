name: Renovate ODG
on:
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC (02:00/03:00 CET/CEST)
  workflow_dispatch:
    inputs:
      repoCache:
        description: 'Reset or disable the cache?'
        type: choice
        default: enabled
        options: [ enabled, disabled, reset ]
      ignoreSchedule:
        description: 'Ignore renovate.json5 schedule'
        type: boolean
        default: false
      logLevel:
        description: 'Log level'
        type: choice
        default: info
        options: [ info, debug ]
      useOdgbotCredentials:
        description: 'Use odgbot GitHub App credentials if configured (else: GITHUB_TOKEN)'
        type: boolean
        default: true
  pull_request:
    branches:
      - main
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate.yml

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  cache_archive: renovate_cache.tar.gz
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: renovate-cache
  RENOVATE_CONFIG_FILE: .github/renovate.json5

jobs:
  # validate is side-effect-free and runs everywhere (incl. forks).
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ env.RENOVATE_CONFIG_FILE }}
          persist-credentials: false

      - name: Create validator script
        run: printf '#!/bin/bash\nrenovate-config-validator "$RENOVATE_CONFIG_FILE"\n' > renovate-config-validator.sh && chmod +x renovate-config-validator.sh

      - name: Validate Renovate config
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          docker-cmd-file: renovate-config-validator.sh
          renovate-version: '44.39.0@sha256:e331219979fc6b38fc5cf7cd5beda63d4fc19963c3ef20404a2e99c8c12118a0'
          token: ${{ secrets.GITHUB_TOKEN }}

  # PR events get a read-only dry-run everywhere (incl. forks, which can then
  # test config changes in their own PRs). Scheduled runs only happen in the
  # open-component-model org. Manual runs (workflow_dispatch) additionally work
  # in forks: the odgbot App credentials are used when toggled on and
  # configured, otherwise the run falls back to GITHUB_TOKEN.
  renovate:
    if: github.event_name != 'schedule' || github.repository_owner == 'open-component-model'
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: automation
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout:
            ${{ env.RENOVATE_CONFIG_FILE }}
          persist-credentials: false

      # Restore previous cache artifact if enabled
      - name: Restore renovate cache artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.repoCache != 'disabled' }}
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        continue-on-error: true
        with:
          name: ${{ env.cache_key }}
          path: cache-download

      - name: Extract renovate cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.repoCache != 'disabled' }}
        run: |
          set -euxo pipefail
          if [ ! -d cache-download ]; then
            echo "No cache found."
            exit 0
          fi
          mkdir -p "$cache_dir"
          tar -xzf "cache-download/${cache_archive}" -C "$cache_dir"
          sudo chown -R 12021:0 /tmp/renovate/
          ls -R "$cache_dir" || true

      - name: Generate odgbot token
        # Scheduled runs always use the App credentials; manual runs only when
        # the toggle is on and the credentials are configured — otherwise the
        # GITHUB_TOKEN fallback in the Run step kicks in. PR dry-runs never
        # need a token.
        if: ${{ github.event_name == 'schedule' || (inputs.useOdgbotCredentials && vars.ODG_BOT_APP_ID != '') }}
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ODG_BOT_APP_ID }}
          private-key: ${{ secrets.ODG_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write
          permission-vulnerability-alerts: read

      - name: Ensure Dry-Run without odgbot credentials
        # Dry-run whenever no odgbot App token will be generated (negated
        # condition of the Generate odgbot token step): PRs always, and manual
        # runs with the toggle off or without configured credentials. The
        # read-only GITHUB_TOKEN fallback cannot push branches or PRs.
        if: ${{ !(github.event_name == 'schedule' || (inputs.useOdgbotCredentials && vars.ODG_BOT_APP_ID != '')) }}
        run: echo "RENOVATE_DRY_RUN=extract" >> "$GITHUB_ENV"

      - name: Run
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          env-regex: |
            ^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy)$
          token: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}
          renovate-version: '44.39.0@sha256:e331219979fc6b38fc5cf7cd5beda63d4fc19963c3ef20404a2e99c8c12118a0'
        env:
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_USERNAME: 'odgbot[bot]'
          RENOVATE_PLATFORM: 'github'
          RENOVATE_PLATFORM_COMMIT: 'enabled'
          RENOVATE_REPOSITORIES: "${{ github.repository }}"
          RENOVATE_REPOSITORY_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.repoCache || 'enabled' }}
          RENOVATE_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.ignoreSchedule) && '{"schedule":null}' || '' }}
          LOG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.logLevel || 'info' }}
          RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS: '["python3"]'

      - name: Compress renovate cache
        if: ${{ env.RENOVATE_DRY_RUN == '' && (github.event_name != 'workflow_dispatch' || inputs.repoCache != 'disabled') }}
        run: |
          set -euxo pipefail
          ls "$cache_dir" || true
          tar -czvf "$cache_archive" -C "$cache_dir" .

      - name: Upload renovate cache artifact
        if: ${{ env.RENOVATE_DRY_RUN == '' && (github.event_name != 'workflow_dispatch' || inputs.repoCache != 'disabled') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.cache_key }}
          path: ${{ env.cache_archive }}
          retention-days: 1
