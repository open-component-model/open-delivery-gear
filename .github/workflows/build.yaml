name: Build and publish OCI artifacts

on:
  workflow_call:
    inputs:
      version:
        description: Bare semver, no leading 'v' (0.7.0 or 0.7.0-rc.1)
        required: true
        type: string
      publish:
        description: Push images and charts to the registry and create attestations
        required: false
        type: boolean
        default: true
    outputs:
      network-chart-digest:
        description: Digest of the published network Helm chart
        value: ${{ jobs.helm-chart.outputs.network-chart-digest }}

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  helm-chart:
    name: Build Helm chart
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
    outputs:
      network-chart-digest: ${{ steps.push.outputs.network-chart-digest }}
    strategy:
      matrix:
        chart:
          - name: network
            dir: charts/network
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        env:
          VERSION: ${{ inputs.version }}
        run: |
          helm package ${{ matrix.chart.dir }} --version "${VERSION}" --app-version "${VERSION}"
      - name: Push chart
        if: inputs.publish
        id: push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          OWNER="${OWNER,,}"

          output=$(helm push ${{ matrix.chart.name }}-${VERSION}.tgz \
            oci://$REGISTRY/$OWNER/odg/charts)
          echo "${output}"

          digest=$(echo "${output}" | grep '^Digest:' | cut -d' ' -f2)

          echo "${{ matrix.chart.name }}-chart-digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "CHART_DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
      - name: Sign Helm chart (cosign keyless)
        if: inputs.publish
        run: |
          cosign sign -y "$REGISTRY/$OWNER/odg/charts/${{ matrix.chart.name }}@${{ env.CHART_DIGEST }}"
      - name: Attest Helm chart
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ env.CHART_DIGEST }}
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/odg/charts/${{ matrix.chart.name }}
