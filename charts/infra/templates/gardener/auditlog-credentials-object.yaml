apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: gardener-auditlog-credentials
spec:
  providerConfigRef:
    name: {{ .Values.gardener.providerConfigName }}
  references:
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: {{ .Values.auditlog.sourceSecretName }}
        namespace: {{ .Values.secrets.outputNamespace }}
        fieldPath: data.user
      toFieldPath: data.user
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: {{ .Values.auditlog.sourceSecretName }}
        namespace: {{ .Values.secrets.outputNamespace }}
        fieldPath: data.password
      toFieldPath: data.password
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: auditlog-credentials
        namespace: {{ required "gardener.gardenNamespace is required" .Values.gardener.gardenNamespace }}
      type: Opaque
      data:
        user: ""
        password: ""
