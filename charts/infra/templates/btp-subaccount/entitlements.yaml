apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: Entitlement
metadata:
  name: {{ .Values.subaccount.name }}-service-manager
spec:
  forProvider:
    serviceName: service-manager
    servicePlanName: subaccount-admin
    enable: true
    subaccountRef:
      name: {{ include "infra.subaccountRef" . }}
  providerConfigRef:
    name: {{ include "infra.providerConfigName" . }}
---
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: Entitlement
metadata:
  name: {{ .Values.subaccount.name }}-cis
spec:
  forProvider:
    serviceName: cis
    servicePlanName: local
    enable: true
    subaccountRef:
      name: {{ include "infra.subaccountRef" . }}
  providerConfigRef:
    name: {{ include "infra.providerConfigName" . }}
