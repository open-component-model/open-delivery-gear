apiVersion: btp.sap.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: {{ include "infra.providerConfigName" . }}
spec:
  cisCredentials:
    secretRef:
      key: {{ .Values.secrets.cisCredentials.key }}
      name: {{ .Values.secrets.cisCredentials.name }}
      namespace: {{ .Values.secrets.namespace }}
    source: Secret
  cliServerUrl: {{ .Values.btp.cliServerUrl }}
  globalAccount: {{ required "btp.globalAccountId is required" .Values.btp.globalAccountId }}
  serviceAccountSecret:
    secretRef:
      key: {{ .Values.secrets.serviceAccount.key }}
      name: {{ .Values.secrets.serviceAccount.name }}
      namespace: {{ .Values.secrets.namespace }}
    source: Secret
