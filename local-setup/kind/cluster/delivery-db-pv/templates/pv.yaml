apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-delivery-db-0
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 8Gi
  hostPath:
    path: {{ .Values.persistence.containerPath | quote }}
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Delete
  storageClassName: standard
  volumeMode: Filesystem
