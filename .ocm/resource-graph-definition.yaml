                repository: ${resourcePrometheusImage.status.additional.oci.registry}/${resourcePrometheusImage.status.additional.oci.repository}
                tag: ${resourcePrometheusImage.status.additional.oci.tag}@${resourcePrometheusImage.status.additional.oci.digest}
            prometheus-config-reloader:
