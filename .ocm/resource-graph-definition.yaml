    - id: ociRepositoryPrometheusOperator
      includeWhen:
        - ${schema.spec.observability.enabled}
      readyWhen:
        - ${ociRepositoryPrometheusOperator.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: prometheus-operator
        spec:
          interval: 1m0s
          layerSelector:
            mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
            operation: copy
          url: oci://${resourcePrometheusOperatorChart.status.additional.oci.registry}/${resourcePrometheusOperatorChart.status.additional.oci.repository}
          ref:
            digest: ${resourcePrometheusOperatorChart.status.additional.oci.digest}
          verify:
            provider: cosign
            matchOIDCIdentity:
              - issuer: https://token.actions.githubusercontent.com
                subject: ^https://github\.com/open-component-model/odg-observability/\.github/workflows/build\.yaml@refs/heads/release-\d+\.\d+$
    - id: helmReleasePrometheusOperator
