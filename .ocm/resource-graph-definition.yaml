        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: prometheus-operator
        spec:
          releaseName: prometheus-operator
          interval: 1m
          timeout: 5m
          targetNamespace: ${schema.spec.namespace}
          storageNamespace: ${schema.spec.namespace}
          install:
            crds: Create
            createNamespace: true
            timeout: 2m
            remediation:
              retries: 1
          upgrade:
            crds: CreateReplace
            cleanupOnFail: true
            force: true
            remediation:
              retries: 3
              strategy: rollback
          chartRef:
            kind: OCIRepository
            name: ${ociRepositoryPrometheusOperator.metadata.name}
            namespace: ${schema.metadata.namespace}
          values:
            alertmanager:
              enabled: true
              image:
                repository: ${resourceAlertmanagerImage.status.additional.oci.registry}/${resourceAlertmanagerImage.status.additional.oci.repository}
                tag: ${resourceAlertmanagerImage.status.additional.oci.tag}@${resourceAlertmanagerImage.status.additional.oci.digest}
            image:
